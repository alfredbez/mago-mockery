name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Mago ${{ matrix.mago }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
        mago: ["1.60.2", "latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, mbstring, xml, zip
          tools: composer

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies (latest compatible Mago)
        if: matrix.mago == 'latest'
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer update --no-interaction --prefer-dist --no-progress carthage-software/mago

      - name: Install dependencies (pinned Mago)
        if: matrix.mago != 'latest'
        run: composer update --no-interaction --prefer-dist --no-progress --with="carthage-software/mago:${{ matrix.mago }}"

      - name: Verify installed Mago version
        if: matrix.mago != 'latest'
        run: test "$(php vendor/bin/mago --version)" = "mago ${{ matrix.mago }}"

      - name: Validate conformance spec
        run: php tests/check-spec.php

      - name: Run analyzer suite
        run: composer test:analyzer

      - name: Run runtime contract tests
        run: composer test:runtime
