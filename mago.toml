# Configuration for this repository's fixture suite. Applications write their own.
version = "1"
php-version = "8.3"

[source]
paths = ["tests/fixtures"]
includes = ["vendor/mockery/mockery/library"]

[analyzer]
find-unused-definitions = false
find-unused-expressions = false
check-property-initialization = false

[extension-hosts.mockery]
command = ["php", "-d", "xdebug.mode=off", "-d", "pcov.enabled=0", "bin/mago-mockery-worker"]
workers = 1
